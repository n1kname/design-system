# Weekly update pull requests, minor and patch versions grouped into one. A version must be a week
# old before it is offered, so a hijacked release is usually pulled before it reaches us. Merging
# publishes nothing: scripts/publish-new.mjs only publishes package versions bumped by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
