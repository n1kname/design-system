<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Lucide "swatch-book" (lucide.dev, ISC) on the portfolio's orange to blue field. Inverted to the browser theme so it stands out: dark field in a light browser, light in a dark one. -->
